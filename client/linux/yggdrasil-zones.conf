# systemd-resolved: send the routers' zones to their DNS over Yggdrasil.
# Install as /etc/systemd/resolved.conf.d/yggdrasil.conf, then
# `systemctl restart systemd-resolved`.
#
# Global, not set on the ygg0 link: a VPN client that snapshots and restores
# the links' DNS settings (AmneziaVPN does) would undo a per-link setting.
# One router: DNS= is its Yggdrasil node address (it follows the router's node
# key: update it after a key change). Several routers: DNS=127.0.0.2 and a
# local dnsmasq (dnsmasq-ygg-zones.conf) that sends each zone to its router.
# A name outside every routing domain also reaches this server when no link
# claims ~. (a VPN usually does): the router resolves it like any resolver.
[Resolve]
DNS=<ROUTER_YGG_IPV6>
Domains=~home.arpa
