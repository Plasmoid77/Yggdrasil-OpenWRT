# Local DNS forwarder for several independent routers: each router answers
# only its own zone, and this dnsmasq sends every zone to its router over
# Yggdrasil. systemd-resolved hands it only these zones (yggdrasil-split-dns
# with router_dns='127.0.0.2'); all other names keep the normal resolver.
listen-address=127.0.0.2
bind-interfaces
# no upstream and no /etc/hosts: only the zones below are answered
no-resolv
no-hosts
server=/spb.internal/<SPB_ROUTER_YGG_IPV6>
server=/blg.internal/<BLG_ROUTER_YGG_IPV6>
