name: Verify prepared release distribution

on:
  push:
    branches: [refactor/release-distribution]
    paths: [.github/workflows/release-migration-once.yml]

permissions:
  contents: write

concurrency:
  group: one-time-status-release-migration
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: f8abee9bab3a5f1be3c91e7e1bdff8047161c8b2
      EXPECTED_TREE: f545b6a1f6e97595c5642bc8b777e4434df42a27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Retrieve the prepared patch and verify its exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Plasmoid77/Yggdrasil-OpenWRT/git/blobs/cb302130b7ed5bbcac719a1ab2d209385383b50b --jq .content \
            | base64 --decode | gzip --decompress > "$RUNNER_TEMP/release-distribution.patch"
          printf '%s  %s\n' dd1dfbaf6668dce3d1ed0576de11b1a96853bced00abbc8161b3bcf1afb6caf5 "$RUNNER_TEMP/release-distribution.patch" | sha256sum -c -
          git apply --index "$RUNNER_TEMP/release-distribution.patch"
          git rm .github/workflows/release-migration-once.yml
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code "$BASE" -- source client packages
          git diff --check --cached
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck busybox jq
      - name: Run full host checks and public download verification
        shell: bash
        run: |
          set -euo pipefail
          sh tools/check.sh 2>&1 | tee "$RUNNER_TEMP/release-checks.log"
          sh tests/status-download.sh --live 2>&1 | tee -a "$RUNNER_TEMP/release-checks.log"
          git archive --format=tar.gz "$EXPECTED_TREE" > "$RUNNER_TEMP/release-distribution-reviewed-tree.tar.gz"
      - name: Commit verified source and documentation without changing workflow files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/refactor/release-distribution | cut -f1)" = "$GITHUB_SHA"
          # Workflow files are finalized through the connector after validation;
          # this token does not need permission to edit workflow definitions.
          git restore --source=HEAD --staged --worktree -- .github
          git diff --cached --exit-code -- .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: pin status releases and require verified distributions'
          git push origin HEAD:refs/heads/refactor/release-distribution
          echo "Verified source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Full reviewed tree: $EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-distribution-reviewed-tree
          path: |
            ${{ runner.temp }}/release-distribution-reviewed-tree.tar.gz
            ${{ runner.temp }}/release-distribution.patch
            ${{ runner.temp }}/release-checks.log
          if-no-files-found: error
          retention-days: 7
