name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install host check dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck busybox jq
      - name: Run the same checks used by maintainers and agents
        run: sh tools/check.sh
      - name: Build a development distribution from this revision
        run: python3 tools/package.py "dev-${GITHUB_SHA}" --output dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: status-development-package
          path: dist/
          if-no-files-found: error
          retention-days: 7
